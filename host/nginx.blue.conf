server {

	root /var/www/html;

	# Add index.php to the list if you are using PHP
	index index.html index.htm index.nginx-debian.html;
    server_name go.apps.amtgard.com go.amtgard.com; # managed by Certbot


	location / {
		rewrite ^/(.+)?$ /index.php?near=$1 break;
	        proxy_pass http://localhost:32080;
        	include proxy_params;
	}



    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/go.apps.amtgard.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/go.apps.amtgard.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}server {
    if ($host = go.apps.amtgard.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name go.apps.amtgard.com go.amtgard.com;
    listen 80;
    return 404; # managed by Certbot

}
